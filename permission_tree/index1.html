<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery.fancytree/2.27.0/skin-win8/ui.fancytree.css">

  <style id="INLINE_PEN_STYLESHEET_ID">
    .fancytree-container {
  outline: none;
}
  </style>

<p>
  <a id="button1" href="#">Toggle 'The Hobbit'</a>
</p>
<div id="tree"></div>
<div id="statusLine">Fancytree Demo - Click any node!</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.fancytree/2.27.0/jquery.fancytree-all-deps.js"></script>


<script>

$("#tree").fancytree({
  checkbox: true,
  selectMode: 3,
  source: {
    url:
      "https://cdn.rawgit.com/mar10/fancytree/72e03685/demo/ajax-tree-products.json"
  },
  lazyLoad: function(event, data) {
    data.result = {url: "https://cdn.rawgit.com/mar10/fancytree/72e03685/demo/ajax-sub2.json"};
  },

  activate: function(event, data) {
    $("#statusLine").text(event.type + ": " + data.node);
  },
  select: function(event, data) {
    $("#statusLine").text(
      event.type + ": " + data.node.isSelected() + " " + data.node
    );
  }
});

// Sample button
$("#button1").click(function() {
  var tree = $.ui.fancytree.getTree(),
    node = tree.findFirst(function(n) {
      return n.title === "The Hobbit";
    });

  node.toggleSelected();
});

</script>
