<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THC FM – Quotation module (concept)</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14213d;--mut:#667189;--line:#e2e7ef;--side:#12192e;--acc:#0097b2;--accbg:#e1f5f9;--ok:#1b8a5a;--okbg:#e0f4ea;--warn:#b87400;--warnbg:#fdf0d5;--bad:#cf3f3f;--badbg:#fbe5e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1224;--card:#171e36;--ink:#e8ecf6;--mut:#8f9bb8;--line:#273050;--side:#0a0f1e;--acc:#2cc4e0;--accbg:#12323d;--okbg:#12382a;--warnbg:#3a2f10;--badbg:#3d1a1a}}
:root[data-theme="dark"]{--bg:#0d1224;--card:#171e36;--ink:#e8ecf6;--mut:#8f9bb8;--line:#273050;--side:#0a0f1e;--acc:#2cc4e0;--accbg:#12323d;--okbg:#12382a;--warnbg:#3a2f10;--badbg:#3d1a1a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:210px;background:var(--side);color:#c9d1e6;padding:18px 12px;flex:none;display:flex;flex-direction:column}
aside b{color:#fff;font-size:16px;margin:0 8px 18px}aside a{padding:9px 10px;border-radius:8px;margin-bottom:2px;cursor:pointer}
aside a.on{background:var(--acc);color:#fff;font-weight:600}aside small{margin:18px 8px 4px;color:#8f9bb8}
main{flex:1;min-width:0;padding:22px 26px}h1{font-size:21px;margin:0}h2{font-size:15px;margin:0 0 4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:8px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}button.d{color:var(--bad)}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}.pad{padding:14px;margin-bottom:12px}
.pad input,.pad select,.pad textarea{width:100%;margin-top:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 input{margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.kpi{padding:11px 14px}.kpi span{color:var(--mut);font-size:12px;display:block}.kpi strong{font-size:18px}
.bar{display:flex;gap:8px;padding:12px;flex-wrap:wrap;align-items:center}.bar input{flex:1;min-width:170px}.bar select{max-width:170px}.bar label{color:var(--mut)}
.tw{overflow-x:auto}.lg{width:100%;border-collapse:collapse}.lg th,.lg td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:top}
.lg th{color:var(--mut);font-size:12px}.lg tbody tr{cursor:pointer}.lg tbody tr:hover,.lg tr.me{background:var(--accbg)}.lg td.w{white-space:normal;min-width:200px}.lg small{color:var(--mut)}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accbg);color:var(--acc);white-space:nowrap}
.tag.Approved{background:var(--okbg);color:var(--ok)}.tag.Notapproved{background:var(--badbg);color:var(--bad)}.tag.Pending{background:var(--warnbg);color:var(--warn)}.tag.Draft,.tag.Superseded{background:var(--line);color:var(--mut)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}#pv{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
.it{display:grid;grid-template-columns:70px 1fr 100px 90px 28px;gap:6px;margin-bottom:6px;align-items:center}.it input{margin:0!important}.it.h{color:var(--mut);font-size:12px}.it b{text-align:right}
.tr{display:flex;gap:6px;margin-top:6px}.tr textarea{flex:1;margin:0!important}
.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 8px}.kv span{color:var(--mut)}
.sheet{background:#fff;color:#111;font:12px/1.45 Calibri,"Segoe UI",sans-serif;padding:26px 30px;border:1px solid var(--line);border-radius:6px}
.sheet p{margin:8px 0}.sheet table{width:100%;border-collapse:collapse}.sheet th,.sheet td{border:1px solid #333;padding:3px 6px;text-align:left;color:#111}.sheet .r{text-align:right}.sheet .c{text-align:center}
.lh{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:#2a2a72;font-size:11px}.logo{font-size:34px}.sheet ol{padding-left:18px;margin:4px 0}
.sg{display:flex;justify-content:space-between;gap:12px;margin-top:14px}.ap{border:1px solid #333;background:#ddd;padding:6px 10px;width:42%}.ft{margin-top:16px;background:#2a2a72;color:#fff;padding:8px 10px;font-size:10px}
#ph{display:none}@media print{body>*:not(#ph){display:none!important}#ph{display:block}.sheet{border:0}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:9}
@media(max-width:820px){body{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px;align-items:center}aside b{width:100%;margin:0 4px 6px}aside small{display:none}main{padding:14px}.two{grid-template-columns:1fr}#pv{position:static;max-height:none}}
</style></head><body>
<aside><b>THC Facility Mgmt</b><a data-v="log">Quotation log</a><a data-v="A">New quote · AMC client</a><a data-v="N">New quote · Non-AMC</a><a data-v="perf">My performance</a><small>Logged in as</small><select id="us"></select></aside>
<main id="v"></main><div id="ph"></div><div id="toast"></div>
<datalist id="uom"><option>Lumpsum</option><option>No.</option><option>Set</option><option>m</option><option>m²</option><option>m³</option><option>Hr</option><option>Day</option><option>Month</option><option>Visit</option><option>Kg</option><option>Ltr</option></datalist>
<script>
const $=s=>document.querySelector(s),H=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),M=(a,f)=>a.map(f).join("");
const f3=x=>(+x||0).toLocaleString("en",{minimumFractionDigits:3,maximumFractionDigits:3});
const TODAY="2026-10-27",USERS={MA:["Mohammed Ali","Operations Manager"],FY:["Fatima Yusuf","Senior Estimator"],SH:["Sayed Hasan","Projects Engineer"]};
const AMC=[["C0179","Zayani Motors","P.O. Box 2399, Manama, Kingdom of Bahrain","+973 3944 1015"],["C0178","Black Fortune","Bldg 12, Road 3815, Seef, Kingdom of Bahrain","+973 3728 3293"],["C0175","AK Venture","Office 21, Bldg 5, Road 1702, Diplomatic Area, Manama","17212130"],["C0173","UAE Embassy","Block 321, Road 2108, Juffair, Kingdom of Bahrain","17748333"],["C0172","Seef Entertainment W.L.L","Block 428, Seef District, Kingdom of Bahrain","17000000"]];
const T0=["Payment to be made in advance. (Cash/Cheque)","Validity for the quotation 15 Days.","Prices are valid for the above item/quantity. If there is any change in item/quantity, we reserve the right to revise prices.","Items cannot be returned once purchased.","Completion: 2-4 days from date of confirmed order.","On opening the system further, unforeseen concerns may arise for which we may need to quote separately.","Scaffolding excluded. If required an additional quote will be provided."];
const LIB=["Payment terms: 50% advance, balance on completion.","Warranty: 12 months on workmanship from date of completion.","Works to be carried out after normal working hours; night-work charges apply.","Materials priced as of quotation date; subject to supplier price changes.","Client to provide access, power and water at the work location.","Prices exclude permits, approvals and authority fees."];
const REASONS=["Price too high","Budget not approved","Scope changed","Went with another vendor","No response / expired","Other"];
const UNITS=["Lumpsum","No.","Nos","Set","Lot","Job","Pcs","Trip","Visit","Hr","Day","Month","m","m²","m³","Kg","Ltr","Box","Roll","Pack","Pair"];
let uid=1,nextSeq=7073,nextNA=3,CU="MA",ED=null,F={q:"",client:"",st:"",type:"",user:"",sup:false};
const mm=d=>d.slice(5,7)+d.slice(2,4),bno=(u,s,d)=>`CG/THC/${u}/QTN/${s}/${mm(d)}`;
function mk(seq,rev,client,code,amc,subj,date,user,items,st,remark){const a=AMC.find(c=>c[0]==code);return{id:uid++,seq,rev,no:seq?bno(user,seq,date):"",client,code,amc,addr:a?a[2]:"M/S "+client+", Manama, Kingdom of Bahrain",contact:"",attn:"",subj,date,user,items,vat:10,terms:T0.slice(),st,remark:remark||""}}
let Q=[mk(7065,0,"M/S Al Futtaim","NA-0001",0,"Supply & installation of access panel for M&S BCC.","2025-08-11","MA",[["Supply and installation of 60x60 access panel for reachable height ceiling",2,"No.",37.5]],"Approved"),
mk(7066,0,"Zayani Motors","C0179",1,"Chiller coil replacement – showroom","2026-10-05","MA",[["Chiller coil replacement incl. gas charging",1,"Lumpsum",1450]],"Superseded"),
mk(7066,1,"Zayani Motors","C0179",1,"Chiller coil replacement – showroom","2026-10-08","MA",[["Chiller coil replacement incl. gas charging",1,"Lumpsum",1320]],"Approved"),
mk(7067,0,"Black Fortune","C0178",1,"Kitchen hood & duct cleaning","2026-10-12","FY",[["Kitchen hood degreasing",4,"No.",85],["Duct cleaning",120,"m",6.5]],"Not approved","Price too high – client asked for a re-quote with reduced scope"),
mk(7068,0,"UAE Embassy","C0173",1,"Replacement of split AC units","2026-10-14","SH",[["Supply & install 2TR split AC unit",3,"Set",410]],"Pending"),
mk(7069,0,"AK Venture","C0175",1,"Repainting of reception area","2026-10-20","FY",[["Repainting of walls, two coats",85,"m²",3.2],["Surface preparation",1,"Lumpsum",120]],"Pending"),
mk(7070,0,"Mr. Rashid Thamer Al Dossary","NA-0002",0,"Water pump replacement – villa","2026-10-02","SH",[["Supply & install booster pump",1,"Lumpsum",260]],"Approved"),
mk(7071,0,"Seef Entertainment W.L.L","C0172",1,"Annual pest control","2026-09-28","MA",[["Monthly pest control visits",12,"Month",45]],"Not approved","Budget not approved – revisit in Q1 2027"),
mk(null,0,"Zayani Motors","C0179",1,"Electrical panel inspection","2026-10-27","MA",[["Thermographic inspection of DB panels",1,"Lumpsum",180]],"Draft")];
const amt=q=>q.items.reduce((t,r)=>t+r[1]*r[3],0),discAmount=q=>q.discVal?Math.min(amt(q),q.discType=="percent"?(amt(q)*q.discVal)/100:q.discVal):0,netAmt=q=>Math.max(0,amt(q)-discAmount(q)),tot=q=>netAmt(q)*(1+q.vat/100),SENT=["Pending","Approved","Not approved"],sm=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const exp=q=>q.st=="Pending"&&(new Date(TODAY)-new Date(q.date))/864e5>15;
const tg=q=>`<span class="tag ${q.st.replace(" ","")}">${q.st}${exp(q)?" · expired":""}</span>`;
const fnm=q=>q.user+"-QTN-"+(q.seq||"DRAFT")+(q.rev?"-R"+q.rev:"");
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t.h);t.h=setTimeout(()=>t.style.display="none",2600)}
function fd(s){const d=new Date(s+"T00:00"),n=d.getDate(),o=["th","st","nd","rd"][(n%100>10&&n%100<14)||n%10>3?0:n%10];return n+o+" "+d.toLocaleString("en",{month:"long"})+" "+d.getFullYear()}
function sheet(q){const a=amt(q),da=discAmount(q),na=netAmt(q),v=na*q.vat/100,u=USERS[q.user];return `<div class="sheet"><div class="lh"><b class="logo">thc.</b><span>FACILITY<br>MANAGEMENT</span></div>
<p><b>No: ${q.no?q.no+(q.rev?"/R"+q.rev:""):"(assigned on issue)"}<br>Date: ${fd(q.date)}</b></p>
<p><b>To,<br>${H(q.client||"—")}<br>${H(q.addr).replace(/\n/g,"<br>")}</b>${q.code?`<br>Client code: ${q.code}`:""}</p>${q.attn?`<p><b>Kind Attn ${H(q.attn)}</b></p>`:""}
<p><b><u>Sub: ${H(q.subj||"—")}</u></b><br>With reference to subject job we are pleased to submit our offer as under: -</p>
<table><tr><th>Sl.</th><th>Description</th><th>Qty</th><th>Unit</th><th>Total</th></tr>${M(q.items,(r,i)=>`<tr><td>${i+1}.</td><td>${H(r[0])}</td><td>${r[1]}</td><td>${H(r[2])}</td><td class="r">${f3(r[1]*r[3])}</td></tr>`)}
${da>0?`<tr><td colspan="4" class="c"><b>Gross Amount Excluding VAT</b></td><td class="r"><b>${f3(a)}</b></td></tr><tr><td colspan="4" class="c" style="color:#b91c1c"><b>Discount ${q.discType=="percent"?`(${q.discVal}%)`:""}</b></td><td class="r" style="color:#b91c1c"><b>-${f3(da)}</b></td></tr><tr><td colspan="4" class="c"><b>Net Amount Excluding VAT</b></td><td class="r"><b>${f3(na)}</b></td></tr>`:`<tr><td colspan="4" class="c"><b>Amount Excluding VAT</b></td><td class="r"><b>${f3(a)}</b></td></tr>`}
<tr><td colspan="4" class="c"><b>VAT ${q.vat}%</b></td><td class="r"><b>${f3(v)}</b></td></tr><tr><td colspan="4" class="c"><b>Total Amount</b></td><td class="r"><b>${f3(na+v)}</b></td></tr></table>
<p><b><u>Terms and Condition:</u></b></p><ol>${M(q.terms,t=>`<li>${H(t)}</li>`)}</ol><p>We hope you will find our offer quite competitive and in line with your requirements and look forward to receiving your valued order confirmation at the earliest.</p>
<div class="sg"><div><b>Thanking you,<br><br>Yours sincerely,<br>THC Facility Management W.L.L<br><br>${u[0]}<br>${u[1]}</b></div><div class="ap">Approved By:<br><br>Name:<br><br>Date:</div></div>
<div class="ft">Tel: +973 17 100 190 | info@thc.com.bh | www.thc.com.bh · CR 88982-1 · YBA Kanoo Tower, Diplomatic Area, Kingdom of Bahrain</div></div>`}
function pdf(q){const fn=fnm(q);$("#ph").innerHTML=sheet(q);const t=document.title;document.title=fn;toast("File name: "+fn+".pdf (choose Save as PDF)");try{window.print()}catch(e){}document.title=t}
function go(v){document.querySelectorAll("aside a").forEach(a=>a.classList.toggle("on",a.dataset.v==v));ED=null;if(v=="log")vlog();if(v=="perf")vperf();if(v=="A"||v=="N"){ED={id:uid++,seq:null,rev:0,no:"",client:"",code:"",amc:v=="A",addr:"",contact:"",attn:"",subj:"",date:TODAY,user:CU,items:[["",1,"Lumpsum",0]],vat:10,discType:"amount",discVal:0,terms:T0.slice(),st:"Draft",remark:""};edit()}}
document.querySelectorAll("aside a").forEach(a=>a.onclick=()=>go(a.dataset.v));
$("#us").innerHTML=M(Object.keys(USERS),u=>`<option value="${u}">${USERS[u][0]}</option>`);
$("#us").onchange=e=>{CU=e.target.value;const on=document.querySelector("aside a.on");if(on&&["log","perf"].includes(on.dataset.v))go(on.dataset.v);toast("Signing as "+USERS[CU][0]+", "+USERS[CU][1])};
/* LOG */
function vlog(){document.querySelector('aside a[data-v="log"]').classList.add("on");
 const sel=(id,l,o)=>`<select id="${id}"><option value="">${l}</option>${M(o,x=>`<option value="${x[0]}" ${F[{fc:"client",fs:"st",ft:"type",fu:"user"}[id]]==x[0]?"selected":""}>${H(x[1])}</option>`)}</select>`;
 $("#v").innerHTML=`<div class="top"><h1>Quotation log</h1><div><button class="p" id="nA">+ New quote · AMC client</button> <button id="nN">+ New quote · Non-AMC client</button></div></div>
<div class="card bar"><input id="fq" placeholder="Search number, client or subject" value="${H(F.q)}">${sel("fc","All clients",[...new Set(Q.map(x=>x.client))].map(c=>[c,c]))}${sel("fs","All statuses",["Draft","Pending","Approved","Not approved"].map(c=>[c,c]))}${sel("ft","AMC & non-AMC",[["AMC","AMC clients"],["Non-AMC","Non-AMC clients"]])}${sel("fu","All users",Object.keys(USERS).map(u=>[u,USERS[u][0]]))}<label><input type="checkbox" id="fx" ${F.sup?"checked":""}> Show superseded</label></div><div id="res"></div>`;
 $("#nA").onclick=()=>go("A");$("#nN").onclick=()=>go("N");
 [["fq","q"],["fc","client"],["fs","st"],["ft","type"],["fu","user"]].forEach(([i,k])=>$("#"+i).oninput=e=>{F[k]=e.target.value;res()});$("#fx").onchange=e=>{F.sup=e.target.checked;res()};res()}
function res(){const L=Q.filter(x=>(F.sup||x.st!="Superseded")&&(!F.st||x.st==F.st)&&(!F.client||x.client==F.client)&&(!F.type||(F.type=="AMC")==!!x.amc)&&(!F.user||x.user==F.user)&&(x.no+x.client+x.subj).toLowerCase().includes(F.q.toLowerCase()));
 const S=L.filter(x=>SENT.includes(x.st)),A=L.filter(x=>x.st=="Approved");
 $("#res").innerHTML=`<div class="kpis">${M([["Quotes sent",S.length],["Value sent · excl. VAT",f3(sm(S,amt))],["Value sent · incl. VAT",f3(sm(S,tot))],["Approved quotes",A.length],["Approved · excl. VAT",f3(sm(A,amt))],["Approved · incl. VAT",f3(sm(A,tot))]],k=>`<div class="card kpi"><span>${k[0]}</span><strong>${k[1]}</strong></div>`)}</div>
<div class="card tw"><table class="lg"><thead><tr><th>Quote no.</th><th>Client</th><th>Subject</th><th>Date</th><th>By</th><th>Excl. VAT</th><th>Incl. VAT</th><th>Status</th><th></th></tr></thead><tbody>${M(L,x=>`<tr data-id="${x.id}"><td><b>${x.no||"Draft"}</b>${x.rev?` <span class="tag">R${x.rev}</span>`:""}</td><td>${H(x.client)}<br><small>${x.code||"—"} · ${x.amc?"AMC":"Non-AMC"}</small></td><td class="w">${H(x.subj)}</td><td>${x.date}</td><td>${x.user}</td><td>${f3(amt(x))}</td><td>${f3(tot(x))}</td><td class="w">${tg(x)}${x.remark?`<br><small>${H(x.remark)}</small>`:""}</td><td><button data-pdf="${x.id}">PDF</button></td></tr>`)}</tbody></table>${L.length?"":'<p style="padding:24px;text-align:center;color:var(--mut)">No quotations match these filters.</p>'}</div><p style="color:var(--mut);font-size:12px">Totals follow the filters above. Drafts and superseded revisions are never counted.</p>`;
 $("#res").onclick=e=>{const b=e.target.closest("[data-pdf]"),r=e.target.closest("tr[data-id]");if(b)pdf(Q.find(x=>x.id==b.dataset.pdf));else if(r)vq(+r.dataset.id)}}
/* VIEW QUOTE */
function vq(id){const q=Q.find(x=>x.id==id),h=Q.filter(x=>x.seq&&x.seq==q.seq).sort((a,b)=>a.rev-b.rev),pend=q.st=="Pending",a=AMC.find(c=>c[0]==q.code);
 $("#v").innerHTML=`<div class="top"><h1>${q.no||"Draft quotation"}${q.rev?" / R"+q.rev:""} ${tg(q)}</h1><div><button id="bk">← Log</button> ${q.st=="Draft"?'<button id="ed">Edit draft</button>':""}${SENT.includes(q.st)?'<button id="rv">Revise (R'+(Math.max(...h.map(x=>x.rev))+1)+')</button>':""} <button id="dp">Duplicate</button> <button class="p" id="dl">⬇ Download PDF</button></div></div>
<div class="two"><div><div class="card pad"><h2>Details</h2><div class="kv"><span>Client</span><b>${H(q.client)}</b><span>Client code</span><div>${q.code||"—"} (${q.amc?"active AMC client":"non-AMC"})</div><span>Prepared by</span><div>${USERS[q.user][0]}, ${USERS[q.user][1]}</div><span>Amount</span><div>${f3(amt(q))} excl. · <b>${f3(tot(q))}</b> incl. VAT</div><span>PDF file name</span><div>${fnm(q)}.pdf</div>${q.remark?`<span>Remark</span><div>${H(q.remark)}</div>`:""}</div></div>
${h.length>1?`<div class="card pad"><h2>Revision history</h2>${M(h,x=>`<div style="margin-top:8px"><a href="#" data-r="${x.id}">${x.rev?"R"+x.rev:"Original"}</a> · ${x.date} · ${f3(tot(x))} incl. VAT ${tg(x)}</div>`)}</div>`:""}
${pend?`<div class="card pad"><h2>Client decision</h2><button class="p" id="ya">Mark approved</button> <button class="d" id="no">Mark not approved</button><div id="nab" hidden><select id="rs"><option value="">Select reason (required)</option>${M(REASONS,r=>`<option>${r}</option>`)}</select><textarea id="rt" rows="2" placeholder="Additional remark"></textarea><button class="d" id="cf">Confirm not approved</button></div></div>`:""}</div><div id="pv">${sheet(q)}</div></div>`;
 $("#bk").onclick=()=>go("log");$("#dl").onclick=()=>pdf(q);
 document.querySelectorAll("[data-r]").forEach(l=>l.onclick=e=>{e.preventDefault();vq(+l.dataset.r)});
 if($("#ed"))$("#ed").onclick=()=>{ED=JSON.parse(JSON.stringify(q));edit()};
 if($("#rv"))$("#rv").onclick=()=>{ED=JSON.parse(JSON.stringify(q));ED.id=uid++;ED.rev=Math.max(...h.map(x=>x.rev))+1;ED.st="Draft";ED.remark="";ED.date=TODAY;ED.user=CU;edit();toast("Revision R"+ED.rev+" started from "+q.no)};
 $("#dp").onclick=()=>{ED=JSON.parse(JSON.stringify(q));Object.assign(ED,{id:uid++,seq:null,no:"",rev:0,st:"Draft",remark:"",date:TODAY,user:CU});if(!ED.amc)ED.code="";edit();toast("Copied as a new draft")};
 if(pend){$("#ya").onclick=()=>{q.st="Approved";q.remark="";vq(id);toast("Marked approved")};$("#no").onclick=()=>$("#nab").hidden=false;
  $("#cf").onclick=()=>{if(!$("#rs").value)return toast("A reason is required for not approved quotes");q.st="Not approved";q.remark=$("#rs").value+($("#rt").value.trim()?" – "+$("#rt").value.trim():"");vq(id);toast("Marked not approved")}}}
/* EDITOR */
function edit(){const e=ED;
 $("#v").innerHTML=`<div class="top"><h1>${e.seq?"Revise quotation":"New quotation"} <span class="tag">${e.amc?"AMC client":"Non-AMC client"}</span></h1><div><button id="cn">Cancel</button> <button id="sd">Save draft</button> <button class="p" id="is">Issue quote</button></div></div><div class="two"><div>
<div class="card pad"><h2>Client</h2>${e.amc?`<select id="cl"><option value="">Select active AMC client…</option>${M(AMC,c=>`<option value="${c[0]}" ${e.code==c[0]?"selected":""}>${c[0]} · ${c[1]}</option>`)}</select>`:`<div class="g2"><input data-k="client" placeholder="Client name" value="${H(e.client)}" spellcheck="true" autocorrect="on"><input data-k="contact" placeholder="Contact number" value="${H(e.contact)}"></div>`}
<textarea id="ad" data-k="addr" rows="2" ${e.amc?"readonly":""} placeholder="${e.amc?"Address is pulled from the AMC client record":"Client address"}" spellcheck="true" autocorrect="on">${H(e.addr)}</textarea>
<div class="g2"><input data-k="attn" placeholder="Kind attention" value="${H(e.attn)}" spellcheck="true" autocorrect="on"><input type="date" data-k="date" value="${e.date}"></div><input data-k="subj" placeholder="Subject" value="${H(e.subj)}" spellcheck="true" autocorrect="on"><div class="g2"><select data-k="vat">${M([10,5,0],v=>`<option value="${v}" ${e.vat==v?"selected":""}>VAT ${v}%</option>`)}</select><div style="display:flex;gap:4px;"><input type="number" min="0" step="0.001" data-k="discVal" placeholder="Discount (BD or %)" value="${e.discVal||''}" style="flex:1"><select data-k="discType" style="width:75px"><option value="amount" ${e.discType=="amount"?"selected":""}>BD</option><option value="percent" ${e.discType=="percent"?"selected":""}>%</option></select></div></div>
<p style="color:var(--mut);margin:8px 0 0;font-size:12px">Signed as ${USERS[e.user][0]}, ${USERS[e.user][1]} (from the logged-in profile)</p></div>
<div class="card pad"><h2>Scope of works</h2><div class="it h"><span>Qty</span><span>Unit</span><span>Unit price</span><span>Total</span><span></span></div><div id="its"></div><button id="ai">+ Add item</button></div>
<div class="card pad"><h2>Terms and conditions <small style="color:var(--mut);font-weight:400">edit freely for this quote</small></h2><div id="tm"></div><div class="g2"><select id="lib"><option value="">Add from library…</option>${M(LIB,t=>`<option>${H(t)}</option>`)}</select><button id="at" style="margin-top:8px">+ Blank term</button></div><button id="rs" style="margin-top:8px">Reset to default terms</button></div></div><div id="pv"></div></div>`;
 its();tm();pv();
 $("#v").oninput=ev=>{const t=ev.target,k=t.dataset.k;if(k)ED[k]=k=="vat"?+t.value:t.value;else if(t.dataset.f!=null){const r=ED.items[t.dataset.i],f=+t.dataset.f;r[f]=f==1||f==3?+t.value:t.value;$("#rt"+t.dataset.i).textContent=f3(r[1]*r[3])}else if(t.dataset.t!=null)ED.terms[t.dataset.t]=t.value;else return;pv()};
 $("#v").onchange=$("#v").oninput;
 if($("#cl"))$("#cl").onchange=ev=>{const c=AMC.find(x=>x[0]==ev.target.value);ED.code=c?c[0]:"";ED.client=c?c[1]:"";ED.addr=c?c[2]:"";ED.contact=c?c[3]:"";$("#ad").value=ED.addr;pv()};
 $("#lib").onchange=ev=>{if(ev.target.value){ED.terms.push(ev.target.value);tm();pv()}};$("#at").onclick=()=>{ED.terms.push("");tm();pv()};$("#rs").onclick=()=>{ED.terms=T0.slice();tm();pv()};
 $("#ai").onclick=()=>{ED.items.push(["",1,"Lumpsum",0]);its();pv()};
 $("#its").onclick=ev=>{const b=ev.target.closest("[data-rm]");if(b&&ED.items.length>1){ED.items.splice(b.dataset.rm,1);its();pv()}};
 $("#tm").onclick=ev=>{const b=ev.target.closest("[data-x]");if(b){ED.terms.splice(b.dataset.x,1);tm();pv()}};
 $("#cn").onclick=()=>go("log");
 $("#sd").onclick=()=>{commit();toast("Draft saved");go("log")};
 $("#is").onclick=()=>{const e=ED;if(!e.client||(e.amc&&!e.code))return toast(e.amc?"Select an AMC client":"Enter the client name");if(!e.subj.trim())return toast("Subject is required");if(e.items.some(r=>!r[0].trim()||!(r[1]>0)))return toast("Every item needs a description and quantity");
  if(!e.seq){e.seq=nextSeq++;e.no=bno(e.user,e.seq,e.date)}if(!e.code)e.code="NA-"+String(nextNA++).padStart(4,"0");e.st="Pending";e.user=CU;
  Q.forEach(x=>{if(x.seq==e.seq&&x.id!=e.id&&x.rev<e.rev)x.st="Superseded"});commit();vq(e.id);toast(e.no+(e.rev?"/R"+e.rev:"")+" issued. PDF: "+fnm(e)+".pdf")}}
const pv=()=>$("#pv").innerHTML=sheet(ED),commit=()=>{const i=Q.findIndex(x=>x.id==ED.id);i<0?Q.push(ED):Q[i]=ED};
const its=()=>$("#its").innerHTML=M(ED.items,(r,i)=>{const u=r[2]||"Lumpsum",opts=[...UNITS];if(u&&!opts.includes(u))opts.unshift(u);return `<div class="it"><input data-i="${i}" data-f="0" placeholder="Description of work" value="${H(r[0])}" style="grid-column:1/-1" spellcheck="true" autocorrect="on"><input type="number" min="0" data-i="${i}" data-f="1" value="${r[1]}"><select data-i="${i}" data-f="2">${M(opts,o=>`<option value="${H(o)}"${o===u?" selected":""}>${H(o)}</option>`)}</select><input type="number" min="0" step="0.001" data-i="${i}" data-f="3" value="${r[3]}"><b id="rt${i}">${f3(r[1]*r[3])}</b><button data-rm="${i}" title="Remove">✕</button></div>`});
const tm=()=>$("#tm").innerHTML=M(ED.terms,(t,i)=>`<div class="tr"><textarea rows="2" data-t="${i}" spellcheck="true" autocorrect="on">${H(t)}</textarea><button data-x="${i}" title="Remove">✕</button></div>`);
/* PERFORMANCE */
function vperf(){const R=Object.keys(USERS).map(u=>{const S=Q.filter(x=>x.user==u&&SENT.includes(x.st)),A=S.filter(x=>x.st=="Approved");return{u,n:S.length,a:A.length,r:S.filter(x=>x.st=="Not approved").length,p:S.filter(x=>x.st=="Pending").length,ve:sm(S,amt),vi:sm(S,tot),av:sm(A,tot)}}),m=R.find(r=>r.u==CU);
 $("#v").innerHTML=`<div class="top"><h1>My performance · ${USERS[CU][0]}</h1></div><div class="kpis">${M([["Quotes sent",m.n],["Approved",m.a],["Not approved",m.r],["Pending",m.p],["Approval rate",m.n?Math.round(m.a/m.n*100)+"%":"—"],["Approved value · incl. VAT",f3(m.av)]],k=>`<div class="card kpi"><span>${k[0]}</span><strong>${k[1]}</strong></div>`)}</div>
<h2 style="margin-top:18px">Team</h2><div class="card tw"><table class="lg"><thead><tr><th>User</th><th>Sent</th><th>Approved</th><th>Not approved</th><th>Pending</th><th>Sent · excl. VAT</th><th>Sent · incl. VAT</th><th>Approved · incl. VAT</th></tr></thead><tbody>${M(R,r=>`<tr class="${r.u==CU?"me":""}"><td><b>${USERS[r.u][0]}</b><br><small>${USERS[r.u][1]}</small></td><td>${r.n}</td><td>${r.a}</td><td>${r.r}</td><td>${r.p}</td><td>${f3(r.ve)}</td><td>${f3(r.vi)}</td><td>${f3(r.av)}</td></tr>`)}</tbody></table></div>`}
go("log");
</script></body></html>
